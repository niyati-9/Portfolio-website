<style>
  :root{ --bg:#f4f3f1; --ink:#1a1a1a; --ink-soft:#4a4a48; --line:#d9d7d2; --accent:#70f6a7; --accent-soft:#a2eba8; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding: 24px;
    position: relative; overflow:hidden;
  }
  a{ color:inherit; }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom: 18px; }
  .code{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size: clamp(80px,20vw,180px); line-height:1; margin: 0; }
  h1{ font-family:'Playfair Display',serif; font-weight:700; font-size: clamp(22px,4vw,32px); margin: 14px 0 12px; }
  p{ font-size:15px; line-height:1.7; color:var(--ink-soft); max-width: 420px; margin: 0 0 34px; }
  .links{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .links a{
    font-family:'Playfair Display',serif; font-style:italic; font-size:15px;
    border:1px solid var(--line); border-radius: 30px; padding: 12px 24px;
    transition: border-color .3s ease, background .3s ease;
  }
  .links a:hover{ border-color: var(--ink); background: rgba(0,0,0,0.03); }
  .blob{
    position:absolute; left:50%; bottom:-160px; transform: translateX(-50%);
    width: 700px; height: 240px;
    background: radial-gradient(ellipse at center, var(--accent) 0%, var(--accent-soft) 40%, rgba(226,73,47,0) 72%);
    filter: blur(24px); opacity:.6; pointer-events:none;
  }
  @media (max-width:480px){ .blob{ width:420px; height:170px; bottom:-110px; } }
</style>
</head>
<body>
  <div class="blob"></div>
  <p class="eyebrow">(this page went missing)</p>
  <p class="code">404</p>
  <h1>Nothing to see here.</h1>
  <p>The page you're looking for has been moved, renamed, or never existed. Let's get you back on track.</p>

    <a href="/index.html">← Back Home</a>
    <a href="/blog.html">Read the Blog</a>
    <a href="/index.html#contact">Get in Touch</a>
  </div>
</body>
